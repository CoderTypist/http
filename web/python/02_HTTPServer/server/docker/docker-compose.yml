services:
  web:
    image: web:1.1
    env_file: ../../web.env
    build:
      context: ../../
      dockerfile: server/docker/Dockerfile-web
    volumes:
      # files to serve
      - ../../files/:/app/files/
      # database dir
      - ../../data:/app/data/
      # local source code (for dev purposes)
      - ../src/:/app/server/src/
    ports:
      - "${WEB_SERVER_PORT}:${WEB_SERVER_PORT}"

